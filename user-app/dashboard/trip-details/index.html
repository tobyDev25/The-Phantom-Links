<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trip Details</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <button id="backBtn" class="back-btn">← Back</button>

    <h1>Trip Details</h1>

    <div class="trip-card">

        <h1 id="tripName">Loading...</h1>

        <div class="trip-meta">
            <span id="tripLocation"></span>
            <span id="tripDate"></span>
            <span id="tripPeople"></span>
        </div>

        <div id="tripStatus" class="status-badge"></div>

        <!-- ACTIONS -->
        <div class="actions">
            <select id="statusSelect"></select>
            <button id="deleteBtn" class="danger">Delete Trip</button>
        </div>

    </div>

</div>

<div class="itinerary-section">

    <h2>Itinerary</h2>

    <div id="itineraryList"></div>

</div>

<script type="module" src="js/trip-details.js"></script>

</body>
</html>
